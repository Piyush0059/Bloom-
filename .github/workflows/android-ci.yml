name: Android build and unit tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Locate Android SDK tools
        shell: bash
        run: |
          test -d "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools were not found under $ANDROID_HOME."
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          dirname "$SDKMANAGER" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          status=$?
          set -o pipefail
          test "$status" -eq 0

      - name: Install Android SDK packages
        shell: bash
        run: |
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          "$SDKMANAGER" "platforms;android-36.1" || echo "API 36.1 package unavailable from this mirror; build output will determine whether it is required."

      - name: Generate a CI-only debug signing key
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -noprompt \
              -keystore debug.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Generate the missing Gradle wrapper
        id: wrapper
        shell: bash
        run: |
          if [ ! -f gradlew ] || [ ! -f gradlew.bat ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 9.3.1 --distribution-type bin
            chmod +x gradlew
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "created=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit the generated wrapper to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.wrapper.outputs.created == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          git commit -m "Add the standard Gradle wrapper"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase FETCH_HEAD
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK for inspection
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bloom-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Start Firebase Auth and Firestore emulators
        shell: bash
        run: |
          firebase emulators:start --only auth,firestore --project demo-no-project --non-interactive > /tmp/bloom-firebase-emulators.log 2>&1 &
          echo $! > /tmp/bloom-firebase-emulators.pid
          ready=false
          for attempt in $(seq 1 90); do
            if curl --silent --output /dev/null http://127.0.0.1:8085/ && curl --silent --output /dev/null http://127.0.0.1:9099/; then
              ready=true
              break
            fi
            if ! kill -0 "$(cat /tmp/bloom-firebase-emulators.pid)" 2>/dev/null; then
              cat /tmp/bloom-firebase-emulators.log
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            cat /tmp/bloom-firebase-emulators.log
            echo "Firebase emulators did not become ready in time."
            exit 1
          fi
          echo "Firebase Auth and Firestore emulators are reachable."

      - name: Run Android unit tests
        id: unit-tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --stacktrace --info

      - name: Upload JUnit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bloom-android-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7

      - name: Show Firebase emulator log on failure
        if: failure()
        run: |
          if [ -f /tmp/bloom-firebase-emulators.log ]; then tail -n 250 /tmp/bloom-firebase-emulators.log; fi

      - name: Stop Firebase emulators
        if: always()
        run: |
          if [ -f /tmp/bloom-firebase-emulators.pid ]; then kill "$(cat /tmp/bloom-firebase-emulators.pid)" 2>/dev/null || true; fi

      - name: Fail the job when unit tests fail
        if: steps.unit-tests.outcome == 'failure'
        run: |
          echo "Android unit tests failed. Download the JUnit report artifact and fix the failing tests."
          exit 1
