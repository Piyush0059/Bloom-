name: Deploy Bloom to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate HTML, referenced IDs, and inline JavaScript
        run: |
          test -s index.html
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          assert "<title>Bloom" in html, "Bloom page title is missing"
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          assert len(scripts) == 1, f"Expected one inline app script, found {len(scripts)}"
          ids = set(re.findall(r'\bid="([^"]+)"', html))
          refs = set(re.findall(r'\$\("([^"]+)"\)', scripts[0]))
          missing = sorted(refs - ids)
          assert not missing, f"JavaScript references missing HTML IDs: {missing}"
          assert "function sendMessage" in scripts[0], "Chat handler not found"
          assert "x-goog-api-key" in scripts[0], "Gemini request configuration not found"
          assert "speechSynthesis" not in scripts[0], "Unexpected browser speech playback detected"
          Path("/tmp/bloom-inline.js").write_text(scripts[0], encoding="utf-8")
          print(f"Static check passed: {len(ids)} DOM IDs, {len(refs)} direct ID references.")
          PY
          node --check /tmp/bloom-inline.js
          if grep -Eq 'AIza[0-9A-Za-z_-]{30,}' index.html; then
            echo "Possible Google API key found in source."
            exit 1
          fi
          echo "JavaScript syntax and API-key source scan passed."
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
